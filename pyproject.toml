[project]
name = "brokeriq"
version = "0.1.0"
description = "Autonomous lead qualification and market intelligence for independent insurance brokers"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ddgs>=9.14.4",
    "fastapi>=0.141.1",
    "fastembed>=0.8.0",
    "httpx>=0.28.1",
    "langgraph>=1.2.10",
    "langgraph-checkpoint-postgres>=3.1.1",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "litellm>=1.95.0",
    "mcp>=1.17",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "qdrant-client>=1.18.0",
    "redis>=8.1.0",
    "sse-starlette>=3.4.6",
    "uvicorn[standard]>=0.52.1",
]

[dependency-groups]
dev = [
    "fakeredis>=2.37.0",
    "hatchling>=1.31.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.1",
]

[project.scripts]
brokeriq = "brokeriq.__main__:main"
brokeriq-mcp = "brokeriq.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brokeriq"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
# BLE001: connection fallbacks and search wrappers intentionally catch broadly —
# third-party clients raise a grab-bag of exceptions we treat as "unavailable".
ignore = ["BLE001"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

