# BrokerIQ local stack — Qdrant, Redis, Postgres + app services.
#
#   docker compose up --build
#
# The API service runs on http://localhost:8000 (SSE streaming + HITL resume).
# The MCP service exposes compliance_search over stdio for MCP clients.
# LLM keys are read from your local .env (shared with the host).

services:
  qdrant:
    image: qdrant/qdrant:v1.15.4
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333; echo -e 'GET /healthz HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3; cat <&3 | grep -q '200 OK'"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: brokeriq
      POSTGRES_PASSWORD: brokeriq
      POSTGRES_DB: brokeriq
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brokeriq -d brokeriq"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    command: ["uv", "run", "uvicorn", "brokeriq.api:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      BROKERIQ_ENV: dev
      POSTGRES_DSN: postgresql://brokeriq:brokeriq@postgres:5432/brokeriq
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379/0
    depends_on:
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

volumes:
  qdrant_data:
  redis_data:
  postgres_data:
